global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'book-catalog-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['book-catalog-service:8081']

  - job_name: 'user-loan-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-loan-service:8082']

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:8083']
