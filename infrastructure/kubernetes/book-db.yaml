apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: book-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-db
  labels:
    app: book-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-db
  template:
    metadata:
      labels:
        app: book-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: bookdb
            - name: POSTGRES_USER
              value: library
            - name: POSTGRES_PASSWORD
              value: library123
          volumeMounts:
            - name: book-db-storage
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "library", "-d", "bookdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "library", "-d", "bookdb"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: book-db-storage
          persistentVolumeClaim:
            claimName: book-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: book-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: book-db
