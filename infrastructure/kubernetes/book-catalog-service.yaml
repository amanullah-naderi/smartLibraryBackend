apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-catalog-service
  labels:
    app: book-catalog-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-catalog-service
  template:
    metadata:
      labels:
        app: book-catalog-service
    spec:
      containers:
        - name: book-catalog-service
          image: smart-library/book-catalog-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: QUARKUS_DATASOURCE_REACTIVE_URL
              value: vertx-reactive:postgresql://book-db:5432/bookdb
            - name: QUARKUS_DATASOURCE_USERNAME
              value: library
            - name: QUARKUS_DATASOURCE_PASSWORD
              value: library123
            - name: QUARKUS_HIBERNATE_ORM_SCHEMA_MANAGEMENT_STRATEGY
              value: update
            - name: QUARKUS_OPENTELEMETRY_TRACER_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4317
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: book-catalog-service
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: book-catalog-service
