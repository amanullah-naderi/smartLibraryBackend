apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-library-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /books
            pathType: Prefix
            backend:
              service:
                name: book-catalog-service
                port:
                  number: 8081
          - path: /loans
            pathType: Prefix
            backend:
              service:
                name: user-loan-service
                port:
                  number: 8082
          - path: /hello
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8083
