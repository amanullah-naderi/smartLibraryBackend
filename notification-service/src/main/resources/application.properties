# Kafka Configuration for Notification Service
mp.messaging.incoming.loan-events.connector=smallrye-kafka
mp.messaging.incoming.loan-events.topic=loan-events
mp.messaging.incoming.loan-events.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.loan-events.auto.offset.reset=earliest

# --- Monitoring (Micrometer/Prometheus) ---
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# --- Tracing (OpenTelemetry) ---
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.propagators=tracecontext,baggage

%prod.quarkus.http.port=8083
