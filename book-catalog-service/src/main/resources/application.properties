# ── Service ──────────────────────────────────────────
quarkus.application.name=book-catalog-service
quarkus.http.port=8081
%test.quarkus.http.test-port=8083

# ── Datenbank (nur für Produktion) ───────────────────
# Im Dev-Modus übernimmt Dev Services automatisch
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=library
%prod.quarkus.datasource.password=library123
%prod.quarkus.datasource.reactive.url=vertx-reactive:postgresql://localhost:5432/bookdb

# ── Hibernate ────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=update

# ── Health & OpenAPI ─────────────────────────────────
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true

# ── Dev Services (DB automatisch via Docker) ─────────
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.enabled=true
%dev.quarkus.datasource.devservices.image-name=postgres:16
%dev.quarkus.datasource.devservices.db-name=bookdb
%dev.quarkus.datasource.devservices.username=library
%dev.quarkus.datasource.devservices.password=library123

%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true

# --- Monitoring (Micrometer/Prometheus) ---
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# --- Tracing (OpenTelemetry) ---
quarkus.opentelemetry.enabled=true
quarkus.opentelemetry.propagators=tracecontext,baggage